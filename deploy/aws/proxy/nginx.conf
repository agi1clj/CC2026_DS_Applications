# Reverse proxy in front of both containers (Elastic Beanstalk with Docker Compose has no
# proxy of its own). Same routing as the Azure setup's two Web Apps, on one host name.
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # FastAPI's interactive API docs.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
    }

    location / {
        proxy_pass http://frontend:8080;
    }
}
