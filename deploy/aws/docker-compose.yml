# Elastic Beanstalk (AWS) deployment bundle: both apps on one EC2 instance.
# The deploy-aws workflow replaces the two image placeholders with <registry>/<repo>:<commit-sha>,
# zips this folder and deploys it. Elastic Beanstalk writes its environment properties
# (API_BASE_URL, CORS_ORIGINS, ... set by the Infra repository) to .env next to this file.
services:
  proxy:
    # Routes /api/* and /health to the backend and everything else to the frontend,
    # like the path rules of a load balancer. Elastic Beanstalk sends traffic to port 80.
    image: public.ecr.aws/nginx/nginx:1.31-alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - "${EB_LOG_BASE_DIR}/proxy:/var/log/nginx"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    image: __BACKEND_IMAGE__
    env_file:
      - .env
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: __FRONTEND_IMAGE__
    env_file:
      - .env
    expose:
      - "8080"
    restart: unless-stopped
