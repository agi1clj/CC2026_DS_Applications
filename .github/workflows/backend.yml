# Backend CI/CD: test -> build image -> push to ACR -> deploy to the backend Web App.
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/wait-for-version.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments of the same app at the same time.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  deploy:
    needs: test
    # Pull requests only run the tests; Azure credentials are used only on main,
    # and only after bootstrap.sh has configured the repository variables.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to request the GitHub OIDC token for Azure login
    env:
      IMAGE: backend
      TAG: ${{ github.sha }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      WEBAPP_NAME: ${{ vars.BACKEND_WEBAPP_NAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC, no secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build image
        run: |
          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          echo "LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"
          docker build \
            --build-arg APP_VERSION="$TAG" \
            --tag "$LOGIN_SERVER/$IMAGE:$TAG" \
            --tag "$LOGIN_SERVER/$IMAGE:latest" \
            backend

      # The commit SHA tag is immutable and is what gets deployed.
      # "latest" is only used by Terraform when it creates the Web App for the first time.
      - name: Push image
        run: |
          docker push "$LOGIN_SERVER/$IMAGE:$TAG"
          docker push "$LOGIN_SERVER/$IMAGE:latest"

      - name: Check that the Web App exists
        id: webapp
        run: |
          if az webapp show --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" --output none 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Web App $WEBAPP_NAME does not exist yet. The image was pushed; run the Terraform workflow with CREATE_WEB_APPS=true to create it."
          fi

      - name: Deploy image to the Web App
        if: steps.webapp.outputs.exists == 'true'
        run: |
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --linux-fx-version "DOCKER|$LOGIN_SERVER/$IMAGE:$TAG" \
            --output none

      - name: Verify /health reports the new version
        if: steps.webapp.outputs.exists == 'true'
        run: |
          HOST="$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" --query defaultHostName --output tsv)"
          ./scripts/wait-for-version.sh "https://$HOST/health" "$TAG"
          echo "Backend deployed: https://$HOST" >> "$GITHUB_STEP_SUMMARY"
