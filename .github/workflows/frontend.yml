# Frontend CI/CD: type-check & build -> build image -> push to ACR -> deploy to the frontend app (Container Apps or App Service).
name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/wait-for-version.sh"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments of the same app at the same time.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  deploy:
    needs: build
    # Pull requests only run the tests; Azure credentials are used only on main,
    # and only after bootstrap.sh has configured the repository variables.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to request the GitHub OIDC token for Azure login
    env:
      IMAGE: frontend
      TAG: ${{ github.sha }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      WEBAPP_NAME: ${{ vars.FRONTEND_WEBAPP_NAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC, no secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build image
        run: |
          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          echo "LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"
          docker build \
            --build-arg APP_VERSION="$TAG" \
            --tag "$LOGIN_SERVER/$IMAGE:$TAG" \
            --tag "$LOGIN_SERVER/$IMAGE:latest" \
            frontend

      # The commit SHA tag is immutable and is what gets deployed.
      # "latest" is only used by Terraform when it creates the container app for the first time.
      - name: Push image
        run: |
          docker push "$LOGIN_SERVER/$IMAGE:$TAG"
          docker push "$LOGIN_SERVER/$IMAGE:latest"

      - name: Install the Container Apps CLI extension
        run: az extension add --name containerapp --only-show-errors

      # The Infra repository decides where the app runs: Azure Container Apps (default) or App Service.
      - name: Find where the app runs
        id: app
        run: |
          if az containerapp show --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" --output none 2>/dev/null; then
            echo "kind=containerapp" >> "$GITHUB_OUTPUT"
          elif az webapp show --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" --output none 2>/dev/null; then
            echo "kind=webapp" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "::notice::App $WEBAPP_NAME does not exist yet. The image was pushed; run the Terraform workflow with CREATE_WEB_APPS=true to create it."
          fi

      - name: Deploy image to the app
        if: steps.app.outputs.kind != 'none'
        run: |
          if [[ "${{ steps.app.outputs.kind }}" == "containerapp" ]]; then
            az containerapp update \
              --resource-group "$RESOURCE_GROUP" \
              --name "$WEBAPP_NAME" \
              --image "$LOGIN_SERVER/$IMAGE:$TAG" \
              --output none
          else
            az webapp config set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$WEBAPP_NAME" \
              --linux-fx-version "DOCKER|$LOGIN_SERVER/$IMAGE:$TAG" \
              --output none
          fi

      - name: Verify /version.txt reports the new version
        if: steps.app.outputs.kind != 'none'
        run: |
          if [[ "${{ steps.app.outputs.kind }}" == "containerapp" ]]; then
            HOST="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" --query properties.configuration.ingress.fqdn --output tsv)"
          else
            HOST="$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" --query defaultHostName --output tsv)"
          fi
          ./scripts/wait-for-version.sh "https://$HOST/version.txt" "$TAG"
          echo "Frontend deployed: https://$HOST" >> "$GITHUB_STEP_SUMMARY"
